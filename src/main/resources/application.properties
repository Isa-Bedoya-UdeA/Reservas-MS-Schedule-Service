spring.application.name=Reservas-MS-Schedule-Service
spring.profiles.active=${SPRING_PROFILE:dev}

# Content Negotiation
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json

# Feign Client URLs
services.auth-service.url=${SERVICES_AUTH_URL:http://localhost:8081}
services.catalog-service.url=${SERVICES_CATALOG_URL:http://localhost:8082}

# JWT Configuration
jwt.secret=${JWT_SECRET:default-secret-key-change-in-prod}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend URL para CORS y enlaces
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Logging base
logging.level.com.codefactory.reservasmsscheduleservice=DEBUG
logging.level.org.springframework.web=INFO

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always